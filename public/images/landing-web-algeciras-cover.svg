<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E3542"/>
      <stop offset="100%" stop-color="#1D212A"/>
    </linearGradient>
    <radialGradient id="glowA" cx="40%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#d4a853" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#d4a853" stop-opacity="0"/>
