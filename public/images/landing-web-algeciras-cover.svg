    <circle cx="16" cy="16" r="4" fill="#d4a853"/><circle cx="30" cy="16" r="4" fill="#d4a853" opacity="0.6"/><circle cx="44" cy="16" r="4" fill="#d4a853" opacity="0.3"/>
    <rect x="16" y="40" width="140" height="10" rx="2" fill="#f2ede6" opacity="0.8"/>
    <rect x="16" y="58" width="200" height="6" rx="2" fill="#f2ede6" opacity="0.35"/>
    <rect x="16" y="70" width="170" height="6" rx="2" fill="#f2ede6" opacity="0.35"/>
    <rect x="16" y="96" width="90" height="26" rx="3" fill="#25d366"/>
