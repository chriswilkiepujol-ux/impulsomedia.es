  <!-- sea -->
  <path d="M -20 360 Q 120 345 240 358 T 480 352 T 720 360 T 840 356" fill="none" stroke="#d4a853" stroke-width="2" opacity="0.35"/>
  <path d="M -20 392 Q 140 378 260 390 T 500 384 T 740 392 T 840 388" fill="none" stroke="#d4a853" stroke-width="1.5" opacity="0.2"/>
