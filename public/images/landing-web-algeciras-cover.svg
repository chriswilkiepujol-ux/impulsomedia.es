    <line x1="133" y1="0" x2="133" y2="450"/><line x1="266" y1="0" x2="266" y2="450"/><line x1="399" y1="0" x2="399" y2="450"/><line x1="532" y1="0" x2="532" y2="450"/><line x1="665" y1="0" x2="665" y2="450"/>
