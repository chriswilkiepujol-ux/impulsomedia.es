<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E3542"/>
      <stop offset="100%" stop-color="#1D212A"/>
    </linearGradient>
    <radialGradient id="glow2" cx="60%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#d4a853" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#d4a853" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad2)"/>
  <rect width="800" height="450" fill="url(#glow2)"/>

  <!-- padel court lines in background -->
  <g opacity="0.18" stroke="#f2ede6" fill="none" stroke-width="2">
    <rect x="120" y="60" width="560" height="330" rx="2"/>
    <line x1="400" y1="60" x2="400" y2="390"/>
    <line x1="120" y1="225" x2="680" y2="225"/>
    <rect x="120" y="60" width="560" height="330" rx="2" transform="scale(1)"/>
    <line x1="260" y1="60" x2="260" y2="390" opacity="0.5"/>
    <line x1="540" y1="60" x2="540" y2="390" opacity="0.5"/>
  </g>

  <!-- padel racket (paddle shape with holes) -->
  <g transform="translate(300,225) rotate(-18)">
    <ellipse cx="0" cy="-70" rx="62" ry="78" fill="#2B313B" stroke="#d4a853" stroke-width="4"/>
    <g fill="#d4a853" opacity="0.55">
      <circle cx="-30" cy="-100" r="4"/>
      <circle cx="0" cy="-108" r="4"/>
      <circle cx="30" cy="-100" r="4"/>
      <circle cx="-38" cy="-72" r="4"/>
      <circle cx="-13" cy="-78" r="4"/>
      <circle cx="13" cy="-78" r="4"/>
      <circle cx="38" cy="-72" r="4"/>
      <circle cx="-42" cy="-42" r="4"/>
      <circle cx="-14" cy="-48" r="4"/>
      <circle cx="14" cy="-48" r="4"/>
      <circle cx="42" cy="-42" r="4"/>
      <circle cx="-30" cy="-18" r="4"/>
      <circle cx="0" cy="-12" r="4"/>
      <circle cx="30" cy="-18" r="4"/>
    </g>
    <rect x="-11" y="5" width="22" height="90" rx="8" fill="#2B313B" stroke="#d4a853" stroke-width="4"/>
  </g>

  <!-- ball with motion lines -->
  <g transform="translate(470,155)">
    <circle cx="0" cy="0" r="22" fill="#d4a853"/>
    <path d="M -22 0 Q 0 -14 22 0 Q 0 14 -22 0" fill="none" stroke="#1D212A" stroke-width="2.5" opacity="0.5"/>
    <line x1="-70" y1="-18" x2="-35" y2="-6" stroke="#f2ede6" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
    <line x1="-78" y1="2" x2="-40" y2="4" stroke="#f2ede6" stroke-width="3" opacity="0.3" stroke-linecap="round"/>
    <line x1="-70" y1="22" x2="-35" y2="10" stroke="#f2ede6" stroke-width="3" opacity="0.2" stroke-linecap="round"/>
  </g>
</svg>
